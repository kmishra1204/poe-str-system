version: '3.9'

services:
  # ──────────────────────────────────────────────
  # Core Infrastructure
  # ──────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: poe-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-poe_str}
      POSTGRES_USER: ${POSTGRES_USER:-poe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-poe_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./04_DATABASE/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-poe} -d ${POSTGRES_DB:-poe_str}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - poe-network

  nats:
    image: nats:2.10-alpine
    container_name: poe-nats
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"   # Client connections
      - "8222:8222"   # HTTP monitoring
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "nats", "server", "check", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - poe-network

  redis:
    image: redis:7-alpine
    container_name: poe-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - poe-network

  # ──────────────────────────────────────────────
  # Observability Stack
  # ──────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53
    container_name: poe-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - poe-network

  grafana:
    image: grafana/grafana:11.1
    container_name: poe-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infrastructure/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - poe-network

  loki:
    image: grafana/loki:2.9
    container_name: poe-loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    networks:
      - poe-network

  promtail:
    image: grafana/promtail:2.9
    container_name: poe-promtail
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./infrastructure/promtail/config.yml:/etc/promtail/config.yml:ro
    depends_on:
      - loki
    networks:
      - poe-network

  # ──────────────────────────────────────────────
  # Application Services
  # ──────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: 07_CODE/backend/Dockerfile
      target: development
    container_name: poe-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-poe}:${POSTGRES_PASSWORD:-poe_dev_password}@postgres:5432/${POSTGRES_DB:-poe_str}
      - REDIS_URL=redis://redis:6379/0
      - NATS_URL=nats://nats:4222
      - PYTHONPATH=/app
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
    volumes:
      - ./07_CODE/backend:/app
      - ./07_CODE/shared:/app/shared:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - poe-network
    develop:
      watch:
        - action: sync
          path: ./07_CODE/backend
          target: /app
        - action: sync
          path: ./07_CODE/shared
          target: /app/shared

  frontend:
    build:
      context: .
      dockerfile: 07_CODE/frontend/Dockerfile
      target: development
    container_name: poe-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
      - NODE_ENV=development
    volumes:
      - ./07_CODE/frontend:/app
      - ./07_CODE/shared:/app/shared:ro
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: npm run dev
    networks:
      - poe-network
    develop:
      watch:
        - action: sync
          path: ./07_CODE/frontend
          target: /app
          ignore:
            - node_modules/
            - .next/
        - action: sync
          path: ./07_CODE/shared
          target: /app/shared

  agent-runtime:
    build:
      context: .
      dockerfile: 07_CODE/backend/Dockerfile
      target: agent-runtime
    container_name: poe-agent-runtime
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-poe}:${POSTGRES_PASSWORD:-poe_dev_password}@postgres:5432/${POSTGRES_DB:-poe_str}
      - REDIS_URL=redis://redis:6379/0
      - NATS_URL=nats://nats:4222
      - PYTHONPATH=/app
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      - AGENT_MODE=development
    volumes:
      - ./07_CODE/backend:/app
      - ./07_CODE/shared:/app/shared:ro
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m app.agents.runtime
    networks:
      - poe-network
    develop:
      watch:
        - action: sync
          path: ./07_CODE/backend
          target: /app
        - action: sync
          path: ./07_CODE/shared
          target: /app/shared

  # ──────────────────────────────────────────────
  # PMS Integration Mocks (for local dev)
  # ──────────────────────────────────────────────
  ownerrez-mock:
    image: ghcr.io/karunam1204/ownerrez-mock:latest
    container_name: poe-ownerrez-mock
    environment:
      - PORT=8080
      - MOCK_MODE=true
    ports:
      - "8081:8080"
    networks:
      - poe-network
    profiles:
      - mocks

  hospitable-mock:
    image: ghcr.io/karunam1204/hospitable-mock:latest
    container_name: poe-hospitable-mock
    environment:
      - PORT=8080
      - MOCK_MODE=true
    ports:
      - "8082:8080"
    networks:
      - poe-network
    profiles:
      - mocks

# ──────────────────────────────────────────────
# Volumes
# ──────────────────────────────────────────────
volumes:
  postgres_data:
  nats_data:
  redis_data:
  prometheus_data:
  grafana_data:
  loki_data:
  frontend_node_modules:
  frontend_next_cache:

# ──────────────────────────────────────────────
# Networks
# ──────────────────────────────────────────────
networks:
  poe-network:
    driver: bridge
    name: poe-network