[build-system]
requires = [
    "poetry-core>=1.0.0",
]
build-backend = "poetry.core.masonry.api"

[project]
name = "poe-str-backend"
version = "0.1.0"
description = "Property Operations Engine - Agentified Short Term Rental Backend"
readme = "README.md"
authors = [
    { name = "Karuna", email = "karunam1204@.com" },
]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Office/Business :: Scheduling",
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pydantic-extra-types>=2.6.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.0",
    "nats-py>=2.7.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "email-validator>=2.1.0",
    "python-dateutil>=2.9.0",
    "pendulum>=3.0.0",
    "structlog>=24.1.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46.0",
    "opentelemetry-instrumentation-sqlalchemy>=0.46.0",
    "opentelemetry-instrumentation-redis>=0.46.0",
    "prometheus-client>=0.19.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "tenacity>=8.2.0",
    "backoff>=2.2.0",
    "croniter>=2.0.0",
]

[project.license]
text = "Proprietary"

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "ipython>=8.25.0",
    "ipdb>=0.13.13",
]
test = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.13.0",
    "pytest-httpx>=0.27.0",
    "pytest-timeout>=2.3.0",
    "faker>=27.0.0",
    "factory-boy>=3.3.0",
]
agents = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-google-genai>=1.0.0",
    "langsmith>=0.1.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
]

[project.urls]
Homepage = "https://github.com/kmishra1204/poe-str-system"
Repository = "https://github.com/kmishra1204/poe-str-system"
Issues = "https://github.com/kmishra1204/poe-str-system/issues"

[tool.poetry.group.dev.dependencies]
debugpy = ">=1.8.0"
watchfiles = ">=0.21.0"

[tool.ruff]
target-version = "py312"
line-length = 100
indent-style = "space"
indent-width = 4
quote-style = "double"
docstring-format = "google"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "T20",
    "SIM",
    "ARG",
    "PTH",
    "ERA",
    "PL",
    "TRY",
]
ignore = [
    "S101",
    "TRY003",
    "ARG001",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",
    "ARG001",
]
"app/agents/*" = [
    "TRY003",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
indent-width = 4
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = false
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "pydantic*",
    "sqlalchemy*",
    "fastapi*",
    "redis*",
    "nats*",
]
ignore_missing_imports = true

[tool.alembic]
script_location = "app/db/migrations"
prepend_sys_path = "."
version_path_separator = "os"
file_template = "%%Y%%m%%d_%%H%%M%%S_%%s"